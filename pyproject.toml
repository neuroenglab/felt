[project]
name = "felt"
version = "0.1.2"
description = "FELT, the perception feedback tool: a marking page for tablets, served from Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.1",
    "python-multipart>=0.0.22",
    "svgutils>=0.3.4",
    "uvicorn>=0.40.0",
]

[project.urls]
Repository = "https://github.com/neuroenglab/MobileFeedback"

[project.scripts]
felt = "felt.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/felt"]
# The built marking page and the hand images ship inside the wheel, whatever
# the ignore rules say.
artifacts = ["src/felt/static/**", "src/felt/hands/**"]

[tool.hatch.build.targets.sdist]
include = ["src/felt", "README.md", "pyproject.toml"]
artifacts = ["src/felt/static/**", "src/felt/hands/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
